<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FOCUS TIMER">
  <title>FOCUS TIMER - 勉強タイマー & Todo</title>
  <link id="faviconLink" rel="icon" type="image/png">
  <link id="appleTouchIconLink" rel="apple-touch-icon" sizes="180x180">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    a[href*="netlify.com"] {
      display: none !important;
    }

    :root {
      --bg: #e2e8f0;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --text: #0f172a;
      --sub-text: #475569;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #e0e7ff;
      --break-color: #10b981;
      --break-light: #d1fae5;
      --accent: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.06);
      --ring-bg: #cbd5e1;
      --input-bg: #f8fafc;
      --input-border: #94a3b8;
      --modal-overlay: rgba(15, 23, 42, 0.55);
      --subject-color: #ef4444;
      --subject-bg: rgba(239, 68, 68, 0.12);
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.92);
      --card-border: rgba(255, 255, 255, 0.15);
      --text: #f8fafc;
      --sub-text: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #818cf8;
      --primary-light: rgba(99, 102, 241, 0.2);
      --break-color: #34d399;
      --break-light: rgba(52, 211, 153, 0.2);
      --accent: #fbbf24;
      --ring-bg: #334155;
      --input-bg: #1e293b;
      --input-border: #475569;
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.45);
      --modal-overlay: rgba(0, 0, 0, 0.75);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .container {
      width: 100%;
      max-width: 1040px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* --- ヘッダー --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: -0.5px;
    }

    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .icon-btn {
      background-color: var(--card-bg);
      border: 2px solid var(--card-border);
      color: var(--text);
      padding: 9px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: var(--shadow);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-family: inherit;
      transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .icon-btn:hover,
    .icon-btn:focus-visible {
      transform: translateY(-2px);
      border-color: var(--primary);
      outline: none;
    }

    .ai-plan-header-btn {
      background: linear-gradient(135deg, var(--primary), #6366f1);
      color: #ffffff;
      border: 2px solid transparent;
    }

    .ai-plan-header-btn:hover,
    .ai-plan-header-btn:focus-visible {
      border-color: var(--accent);
      color: #ffffff;
    }

    /* --- ページ・カード共通 --- */
    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .card {
      background-color: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 24px;
      padding: 26px;
      box-shadow: var(--shadow);
      min-width: 0;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .back-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      background-color: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      font-family: inherit;
      transition: transform 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .back-nav-btn:hover,
    .back-nav-btn:focus-visible {
      transform: translateY(-2px);
      border-color: var(--primary);
      color: var(--primary);
      outline: none;
    }

    /* --- 上下段 1:1 均等グリッド --- */
    .timer-grid,
    .nav-buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .nav-buttons {
      margin-top: 20px;
    }

    @media (max-width: 820px) {
      .timer-grid,
      .nav-buttons {
        grid-template-columns: 1fr;
      }
    }

    /* --- タイマーカード --- */
    .timer-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .mode-toggle-tabs {
      display: flex;
      background-color: var(--input-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 4px;
      margin-bottom: 14px;
      gap: 4px;
    }

    .mode-tab-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 12px;
      background-color: transparent;
      color: var(--sub-text);
      font-weight: 700;
      cursor: pointer;
      font-size: 0.88rem;
      font-family: inherit;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .mode-tab-btn.active {
      background-color: var(--primary);
      color: #ffffff;
    }

    .time-settings {
      display: flex;
      gap: 16px;
      margin-bottom: 14px;
      justify-content: center;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .setting-item label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--sub-text);
    }

    .setting-item input {
      width: 78px;
      padding: 7px 10px;
      border-radius: 12px;
      border: 2px solid var(--input-border);
      background-color: var(--input-bg);
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      outline: none;
      font-family: inherit;
    }

    .timer-subject-selector {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 6px;
      background-color: var(--subject-bg);
      color: var(--subject-color);
      border: 2px solid var(--subject-color);
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .timer-subject-selector.break {
      background-color: var(--break-light);
      color: var(--break-color);
      border-color: var(--break-color);
    }

    .timer-subject-selector select {
      background: transparent;
      border: none;
      color: inherit;
      font-weight: 800;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }

    .timer-subject-selector select option {
      background-color: var(--card-bg);
      color: var(--text);
    }

    .record-target-note {
      font-size: 0.78rem;
      color: var(--sub-text);
      margin-bottom: 6px;
      text-align: center;
    }

    .timer-circle-container {
      position: relative;
      width: 224px;
      height: 224px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0 18px;
    }

    .timer-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .timer-bg-circle {
      fill: none;
      stroke: var(--ring-bg);
      stroke-width: 12;
    }

    .timer-progress-circle {
      fill: none;
      stroke: var(--subject-color);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-dasharray: 628.3;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.35s ease, stroke 0.25s ease;
    }

    .timer-display {
      position: absolute;
      font-size: 3.1rem;
      font-weight: 800;
      font-family: 'Outfit', sans-serif;
      letter-spacing: -1px;
    }

    .timer-controls {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 360px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 96px;
      padding: 13px 16px;
      border: none;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-2px);
      outline: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 8px 18px -4px rgba(79, 70, 229, 0.35);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-success {
      background-color: var(--break-color);
      color: #ffffff;
      box-shadow: 0 8px 18px -4px rgba(16, 185, 129, 0.35);
    }

    .btn-secondary {
      background-color: var(--input-bg);
      color: var(--text);
      border: 2px solid var(--card-border);
    }

    .btn-danger {
      background-color: var(--danger);
      color: #ffffff;
    }

    /* --- Todoカード --- */
    .todo-card {
      display: flex;
      flex-direction: column;
    }

    .todo-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 8px;
    }

    .todo-card-header h2 {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .active-subject-pill {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      background-color: var(--subject-bg);
      color: var(--subject-color);
      border: 1.5px solid var(--subject-color);
      white-space: nowrap;
    }

    /* 3列×2行 教科タブグリッド */
    .subject-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .subject-tab {
      padding: 8px 6px;
      border-radius: 12px;
      background-color: var(--input-bg);
      border: 2px solid var(--card-border);
      color: var(--sub-text);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      min-width: 0;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .subject-tab:hover {
      border-color: var(--primary);
    }

    .subject-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .subject-tab.active {
      background-color: var(--subject-color);
      color: #ffffff;
      border-color: var(--subject-color);
    }

    .subject-tab.active .subject-dot {
      background-color: #ffffff !important;
    }

    .todo-input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .todo-input-group input {
      flex: 1;
      min-width: 0;
      padding: 11px 14px;
      border-radius: 14px;
      border: 2px solid var(--input-border);
      background-color: var(--input-bg);
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
      font-family: inherit;
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 9px;
      min-height: 220px;
      max-height: 270px;
      overflow-y: auto;
      flex: 1;
    }

    .empty-state {
      flex: 1;
      min-height: 215px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px 14px;
      border: 2px dashed var(--card-border);
      border-radius: 18px;
      background-color: var(--input-bg);
      color: var(--sub-text);
      gap: 8px;
    }

    .empty-state-icon {
      font-size: 2rem;
    }

    .empty-state-title {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--text);
    }

    .empty-state-sub {
      font-size: 0.8rem;
      line-height: 1.5;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      background-color: var(--input-bg);
      border-radius: 14px;
      border: 2px solid var(--card-border);
      cursor: pointer;
      gap: 8px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .todo-item.selected-task {
      border-color: var(--subject-color);
      background-color: var(--subject-bg);
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
